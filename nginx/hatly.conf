# ========================================================
# NGINX REVERSE PROXY & DOMAIN ROUTING FOR HATLY PLATFORM
# Domains:
#   - www.hatly.com (Main Website)
#   - app.hatly.com (Customer Web App)
#   - admin.hatly.com (Admin Panel)
#   - api.hatly.com (Backend REST API & WebSocket)
# ========================================================

# Rate Limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# 1. API & WEBSOCKET GATEWAY (api.hatly.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.hatly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hatly.com;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/api.hatly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hatly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 20M;

    # REST API Endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth Rate Limiting
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO Realtime Tracking)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. CUSTOMER WEB APPLICATION (app.hatly.com) & MAIN SITE (www.hatly.com)
server {
    listen 80;
    listen [::]:80;
    server_name www.hatly.com hatly.com app.hatly.com admin.hatly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hatly.com hatly.com app.hatly.com admin.hatly.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/hatly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hatly.com/privkey.pem;

    root /var/www/hatly/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Routing (Single Page App Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
