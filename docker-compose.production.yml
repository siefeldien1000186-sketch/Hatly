version: '3.8'

services:
  # Hatly Backend Node.js API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hatly_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=change_this_to_a_secure_random_key_64_bytes
      - CORS_ORIGIN=https://www.hatly.com,https://app.hatly.com,https://admin.hatly.com
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/stores"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: hatly_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/hatly.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/hatly/frontend/dist:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  backend_data:
